<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Shield outline -->
  <path d="M50 4 L90 20 L90 55 C90 82 70 100 50 114 C30 100 10 82 10 55 L10 20 Z"
        fill="none" stroke="url(#sg)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Inner shield -->
  <path d="M50 16 L80 28 L80 55 C80 75 66 89 50 100 C34 89 20 75 20 55 L20 28 Z"
        fill="rgba(124,58,237,0.15)"/>
  <!-- Lock icon -->
  <rect x="38" y="58" width="24" height="18" rx="3" fill="url(#sg)" opacity="0.9"/>
  <path d="M43 58 L43 52 A7 7 0 0 1 57 52 L57 58" stroke="url(#sg)" stroke-width="3"
        stroke-linecap="round" fill="none"/>
  <circle cx="50" cy="67" r="3" fill="#0a0a0f"/>
</svg>
